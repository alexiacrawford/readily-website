<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Support | Readily</title>

  <link rel="stylesheet" href="/styles.css" />

  <style>
    .support {
      max-width: 800px;
      margin: auto;
      padding: 100px 32px 140px;
    }

    .support h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 58px;
      font-weight: 500;
    }

    .support > p {
      max-width: 650px;
      font-size: 19px;
      color: #66575b;
    }

    .support-card {
      margin-top: 45px;
      padding: 34px;

      border-radius: 24px;
      border: 1px solid #e5d7da;

      background: white;
    }

    .support-card a {
      color: #593a42;
      font-weight: 700;
    }
  </style>
</head>

<body>

  <header class="nav">
    <a href="/" class="logo">Readily</a>

    <nav>
      <a href="/">Home</a>
      <a href="/privacy/">Privacy</a>
    </nav>
  </header>

  <main class="support">

    <p class="eyebrow">SUPPORT</p>

    <h1>How can we help?</h1>

    <p>
      Have a question, found an issue, or want to share feedback about
      Readily? We'd love to hear from you.
    </p>

    <div class="support-card">
        <h2>Contact Readily</h2>
      
        <p>
          Email us at
          <a href="mailto:support@readilybooks.com">
            support@readilybooks.com
          </a>
        </p>
      
        <p>
          Follow us on
          <a
            href="https://www.instagram.com/readily.books"
            target="_blank"
            rel="noopener noreferrer"
          >
            Instagram @readily.books
          </a>
        </p>
      </div>

  </main>

</body>
</html>
