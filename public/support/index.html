  <header class="nav">

      How can we help?

      Readily? We'd love to hear from you.
    </p>


    <div class="support-card">

      <h2>
        Contact Readily
      </h2>

      <p>
        Email us at
        <a href="mailto:support@readilybooks.com">
          support@readilybooks.com
        </a>
      </p>


      <div class="support-socials">

        <!-- Instagram -->
        <a
          class="social-icon"
          href="https://www.instagram.com/readily.books"
          target="_blank"
          rel="noopener noreferrer"
